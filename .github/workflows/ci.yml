name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      # Phase 0 criterion: go build ./... succeeds.
      - name: Build all packages
        run: go build ./...

      # Phase 0 criterion: go vet passes.
      - name: Vet
        run: go vet ./...

      # Phase 0 criterion: unit test runner is green.
      - name: Test (unit — SQLite in-memory, no network)
        run: go test -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      # Phase 0 criterion: golangci-lint (including naming-convention lint).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
